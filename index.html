<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>이미지 넘기기</title>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    h2 {
      margin: 10px 0;
      font-size: 18px;
    }

    .viewer-container {
      height: 75vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      padding: 10px;
    }

    button {
      flex: 1;
      margin: 5px;
      padding: 14px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #333;
      color: white;
    }

    button:active {
      background: #555;
    }

    #pageText {
      margin: 8px 0;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <h2>그림 보기</h2>

  <div class="viewer-container">
    <img id="viewer" src="images/1.png" />
  </div>

  <div id="pageText"></div>

  <div class="controls">
    <button onclick="prevImage()">◀ 이전</button>
    <button onclick="nextImage()">다음 ▶</button>
  </div>

  <script>
    const images = Array.from({length: 40}, (_, i) => `images/${i+1}.png`);

    let currentIndex = 0;

    const viewer = document.getElementById("viewer");
    const pageText = document.getElementById("pageText");

    function showImage() {
      viewer.src = images[currentIndex];
      pageText.textContent = `${currentIndex + 1} / ${images.length}`;
    }

    function prevImage() {
      currentIndex = (currentIndex - 1 + images.length) % images.length;
      showImage();
    }

    function nextImage() {
      currentIndex = (currentIndex + 1) % images.length;
      showImage();
    }

    showImage();
  </script>

</body>
</html>
